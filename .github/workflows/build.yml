name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 4 * * *"   # daily refresh of the Are.na images and the playlist and tarot deck

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so "date added" is accurate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pypdf

      - run: mkdir -p reports && python build.py

      - run: |
          mkdir _site
          cp index.html _site/
          cp images.json _site/ 2>/dev/null || echo "[]" > _site/images.json
          cp tarot.json _site/ 2>/dev/null || echo "[]" > _site/tarot.json
          cp songs.json _site/ 2>/dev/null || echo "[]" > _site/songs.json
          cp -r reports _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jerelevance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f2ea;
    --ink: #16130f;
    --muted: #7a7166;
    --rule: #e2dbcf;
    --hover: #8a2b1d;
    --card: #fffdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121110;
      --ink: #ece6da;
      --muted: #8f877b;
      --rule: #25221f;
      --hover: #d98a6c;
      --card: #1c1a17;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "EB Garamond", Georgia, serif;
    font-size: 17px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 48px 20px 72px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-areas: "head side" "list side" "song side";
    grid-template-rows: auto auto 1fr;
    column-gap: 64px;
  }
  h1 { grid-area: head; }
  ol { grid-area: list; align-self: start; }
  /* Daily image */
  .side {
    grid-area: side;
    align-self: start;
    position: sticky;
    top: 48px;
    padding-top: 14px;
  }
  /* Library of Babel */
  #babel { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .babel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .babel-head .take { margin: 0; }
  #b-shuffle {
    flex: none;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 1px solid var(--rule);
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .2s, border-color .2s, transform .5s cubic-bezier(.3,1.5,.5,1);
  }
  #b-shuffle:hover { color: var(--hover); border-color: var(--hover); }
  #b-shuffle:focus-visible { outline: 2px solid var(--hover); outline-offset: 2px; }
  #b-shuffle.spin { transform: rotate(180deg); }
  .b-loc {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .b-line {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink);
    word-break: break-all;
    white-space: pre-wrap;
    transition: opacity .25s ease;
  }
  .b-line.fade { opacity: 0; }
  #daily[hidden] { display: none; }
  .take {
    font-style: italic;
    color: var(--ink);
    margin-bottom: 10px;
  }
  #d-img {
    display: block;
    max-width: 100%;
    max-height: 400px;
    width: auto;
    height: auto;
    border: 1px solid var(--rule);
  }
  .src {
    margin-top: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .src a { color: var(--muted); font-weight: 400; }
  .reset {
    margin-top: 3px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .src a:hover { color: var(--hover); }
  @media (max-width: 880px) {
    main {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "head" "side" "list" "song";
      grid-template-rows: auto;
    }
    .side { position: static; padding-top: 0; margin-bottom: 28px; max-width: 340px; }
    #d-img { max-height: 300px; }
  }
  h1 {
    font-family: "Pinyon Script", cursive;
    font-weight: 400;
    font-size: clamp(52px, 11vw, 80px);
    line-height: 1;
    text-align: left;
    filter: url(#ink);
    margin-bottom: 28px;
  }
  ol {
    list-style: none;
    border-top: 1px solid var(--rule);
  }
  li {
    counter-increment: item -1;
    display: grid;
    grid-template-columns: 2.2em auto 1fr auto;
    align-items: baseline;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
    min-width: 0;
  }
  li::before {
    content: counter(item, decimal-leading-zero);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    transition: color .15s;
  }
  a:hover { color: var(--hover); }
  .note {
    font-style: italic;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  time {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  @media (max-width: 520px) {
    li { grid-template-columns: 2em minmax(0, 1fr) auto; }
    li a { overflow: hidden; text-overflow: ellipsis; }
    .note { display: none; }
  }
  /* Substack sheep tab */
  .sub-wrap {
    position: fixed;
    left: 0;
    bottom: 0;
    z-index: 20;
    padding: 0 18px 18px 0;
  }
  .sub-wrap::before {
    /* invisible pad so the corner itself belongs to the hover zone */
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 22px;
    height: 22px;
  }
  .sub {
    position: relative;
    left: 18px;
    bottom: 0;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 68px;
    max-width: 68px;
    padding: 6px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--rule);
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    overflow: hidden;
    font-weight: 400;
    transform: translate(-30px, 30px) rotate(12deg);
    transition:
      max-width .55s cubic-bezier(.2,.9,.25,1),
      padding .55s cubic-bezier(.2,.9,.25,1),
      transform .45s cubic-bezier(.3,1.5,.5,1),
      box-shadow .4s ease;
  }
  .sub img {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    transition: transform .5s cubic-bezier(.3,1.6,.5,1);
  }
  .sub .msg {
    display: flex;
    flex-direction: column;
    white-space: nowrap;
    line-height: 1.2;
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity .2s ease, transform .35s ease;
  }
  .sub .msg b {
    font-weight: 500;
    font-style: italic;
    font-size: 20px;
    color: var(--ink);
  }
  .sub .msg small {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }
  .sub-wrap:hover .sub, .sub:focus-visible, .sub.open {
    max-width: 480px;
    padding-right: 26px;
    transform: none;
    box-shadow: 0 10px 34px rgba(0,0,0,.16);
    outline: none;
  }
  .sub-wrap:hover .sub img, .sub:focus-visible img, .sub.open img { transform: rotate(-10deg) scale(1.06); }
  .sub-wrap:hover .msg, .sub:focus-visible .msg, .sub.open .msg {
    opacity: 1;
    transform: none;
    transition-delay: .15s, .1s;
  }
  .sub:hover .msg small { color: var(--hover); }
  @media (prefers-reduced-motion: reduce) {
    .sub, .sub img, .sub .msg { transition: none; }
  }

  /* Tomato plants */
  :root { --stem: #6f8a52; --tomato: #de3a22; --bloom: #d8a51c; }
  @media (prefers-color-scheme: dark) {
    :root { --stem: #8fa86f; --tomato: #ff5f45; --bloom: #ecc34f; }
  }
  main { position: relative; z-index: 1; }
  #garden {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: visible;
  }
  #garden .plant { transition: opacity 1.4s ease; }
  #garden .plant.gone { opacity: 0; }
  .stem { fill: none; stroke: var(--stem); stroke-linecap: round; stroke-linejoin: round; }
  .hair { fill: none; stroke: var(--stem); stroke-width: .4; stroke-linecap: round; opacity: .7; }
  .leaf { fill: var(--stem); fill-opacity: .07; stroke: var(--stem); stroke-width: .6; stroke-linejoin: round; }
  .vein { fill: none; stroke: var(--stem); stroke-width: .35; opacity: .8; }
  .calyx { fill: none; stroke: var(--stem); stroke-width: .7; stroke-linecap: round; stroke-linejoin: round; }
  .fruit { fill: var(--tomato); fill-opacity: .55; stroke: var(--tomato); stroke-width: .9; }
  .crease { fill: none; stroke: var(--tomato); stroke-width: .6; stroke-linecap: round; }
  .shine { fill: none; stroke: #fff; stroke-width: .9; stroke-linecap: round; opacity: .75; }
  .flower { fill: none; stroke: var(--bloom); stroke-width: .8; stroke-linecap: round; stroke-linejoin: round; }
  .grow { animation: grow-in .8s cubic-bezier(.3,1.4,.5,1) both; }
  .shrink { animation: shrink-out .28s ease-in forwards !important; }
  @keyframes grow-in { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes shrink-out { from { transform: scale(1); opacity: 1; } to { transform: scale(0); opacity: 0; } }
  .garden-btn {
    position: fixed;
    left: 4px;
    z-index: 25;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: top 1s cubic-bezier(.4,1.25,.5,1), transform .35s cubic-bezier(.3,1.6,.5,1), opacity .4s ease;
  }
  .garden-btn svg { overflow: visible; }
  .garden-btn:hover { transform: scale(1.18) rotate(-8deg); }
  .garden-btn:active { transform: scale(.9); }
  .garden-btn:focus-visible { outline: 1px dashed var(--muted); outline-offset: 2px; border-radius: 50%; }
  #seed { top: 46%; }
  #seed svg { animation: breathe 3.4s ease-in-out infinite; }
  #slurp { top: 12px; opacity: 0; pointer-events: none; }
  #slurp.on { opacity: .8; pointer-events: auto; }
  #slurp.on:hover { opacity: 1; transform: scale(1.15) rotate(200deg); }
  /* Tarot card: one per visitor per day */
  #tarot {
    position: absolute;
    left: 46px;
    top: 132px;
    z-index: 2;
    width: clamp(48px, calc((100vw - 1120px) / 2 - 34px), 92px);
  }
  #tarot[hidden] { display: none; }
  #tarot img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 3px;
    box-shadow: 0 6px 18px rgba(0,0,0,.14);
    transform: rotate(-3deg);
    transition: transform .45s cubic-bezier(.3,1.5,.5,1), box-shadow .3s;
  }
  #tarot img:hover { transform: rotate(0) scale(1.06); box-shadow: 0 10px 26px rgba(0,0,0,.2); }
  @media (max-width: 1219px) {
    #tarot { left: auto; right: 18px; top: 24px; width: 54px; }
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  @media (prefers-reduced-motion: reduce) {
    .grow, .shrink, #seed svg { animation: none; }
  }

  /* Color generator */
  #colorgen { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .cg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cg-head .take { margin: 0 auto 0 0; }
  .cg-btn {
    flex: none;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 1px solid var(--rule);
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .2s, border-color .2s, opacity .35s ease, transform .35s cubic-bezier(.3,1.5,.5,1);
  }
  .cg-btn:hover { color: var(--hover); border-color: var(--hover); }
  .cg-btn:focus-visible { outline: 2px solid var(--hover); outline-offset: 2px; }
  #cg-lock { opacity: 0; transform: scale(.6); pointer-events: none; }
  #colorgen.paused #cg-lock, #colorgen.locked #cg-lock { opacity: 1; transform: none; pointer-events: auto; }
  #colorgen.locked #cg-lock { color: var(--ink); border-color: var(--ink); }
  #cg-lock .shackle { transition: transform .3s cubic-bezier(.3,1.5,.5,1); transform-origin: 16px 10px; }
  #colorgen.locked #cg-lock .shackle { transform: translateY(2px); }
  #colorgen:not(.locked) #cg-lock .shackle { transform: rotate(-28deg) translate(1px, -1px); }
  .cg-box {
    position: relative;
    width: 100%;
    aspect-ratio: 8 / 9;
    max-height: 400px;
    border: 1px solid var(--rule);
    overflow: hidden;
    background: #ccc;
  }
  #cg-canvas { position: absolute; inset: -8%; width: 116%; height: 116%; display: block; filter: blur(10px) saturate(1.15); }
  .cg-grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .14; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .cg-coords {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 12px 10px;
    display: flex; flex-direction: column; gap: 5px;
    background: linear-gradient(transparent, rgba(0,0,0,.28));
    opacity: 0; transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
    pointer-events: none;
  }
  #colorgen.paused .cg-coords, #colorgen.locked .cg-coords { opacity: 1; transform: none; pointer-events: auto; }
  .cg-row {
    display: flex; align-items: center; gap: 8px;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    background: none; border: 0; padding: 0; cursor: copy; text-align: left; font-variant-numeric: tabular-nums;
  }
  .cg-row i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,.85); flex: none; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .cg-row b { font-weight: 400; letter-spacing: .04em; min-width: 62px; }
  .cg-row span { opacity: .8; }
  .cg-row.copied b::after { content: " copied"; opacity: .8; }
  #colorgen:fullscreen, #colorgen.cg-full {
    position: fixed; inset: 0; z-index: 1000; margin: 0; padding: 0; border: 0; background: #000;
  }
  #colorgen:fullscreen .cg-box, #colorgen.cg-full .cg-box {
    width: 100%; height: 100%; max-height: none; aspect-ratio: auto; border: 0;
  }
  #colorgen:fullscreen .cg-head, #colorgen.cg-full .cg-head {
    position: absolute; top: 18px; right: 18px; z-index: 2; margin: 0;
  }
  #colorgen:fullscreen .cg-head .take, #colorgen.cg-full .cg-head .take { display: none; }
  #colorgen:fullscreen .cg-btn, #colorgen.cg-full .cg-btn {
    width: 38px; height: 38px; color: #fff; border-color: rgba(255,255,255,.45); background: rgba(0,0,0,.18);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #colorgen:fullscreen .cg-coords, #colorgen.cg-full .cg-coords { padding: 24px 24px 22px; gap: 8px; }
  #colorgen:fullscreen .cg-row, #colorgen.cg-full .cg-row { font-size: 13px; }
  #colorgen:fullscreen .cg-row i, #colorgen.cg-full .cg-row i { width: 15px; height: 15px; }

  /* Song of the day: a record that slides out of its sleeve and spins */
  #song { grid-area: song; align-self: start; margin-top: 96px; }
  #song[hidden] { display: none; }
  #song .take { margin-bottom: 14px; }
  .deck { position: relative; width: 340px; max-width: 100%; height: 206px; }
  .vinyl {
    position: absolute; left: 12px; top: 5px; width: 196px; height: 196px; border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 31%, rgba(255,255,255,.05) 31.5% 32%, transparent 32.5%),
      repeating-radial-gradient(circle, #121212 0 1.6px, #1d1d1d 1.6px 2.6px),
      #141414;
    box-shadow: 0 6px 18px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.06);
    transition: transform 1s cubic-bezier(.5,0,.2,1);
    will-change: transform;
  }
  .vinyl::after {
    /* a soft sheen that stays put while the record turns under it */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 30deg, transparent 0 8%, rgba(255,255,255,.09) 12%, transparent 18% 58%, rgba(255,255,255,.07) 62%, transparent 68%);
    pointer-events: none;
  }
  .vinyl .label {
    position: absolute; left: 50%; top: 50%; width: 66px; height: 66px; margin: -33px 0 0 -33px;
    border-radius: 50%; overflow: hidden; background: #333; box-shadow: 0 0 0 2px #0d0d0d;
  }
  .vinyl .label img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.4); }
  .vinyl .label::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: var(--paper);
  }
  #song.out .vinyl { transform: translateX(118px); }
  .sleeve {
    position: absolute; left: 0; top: 0; width: 206px; height: 206px; background: #0d0d0d;
    box-shadow: 0 8px 22px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.04);
    padding: 3px; z-index: 1;
  }
  .sleeve iframe, .sleeve > div { width: 200px; height: 200px; display: block; border: 0; }
  /* the cover sits on the sleeve until the song starts, and comes back when it stops */
  .sleeve .cover {
    position: absolute; left: 3px; top: 3px; width: 200px; height: 200px; object-fit: cover;
    background: #0d0d0d; cursor: pointer; transition: opacity .6s ease;
  }
  #song.playing .sleeve .cover { opacity: 0; pointer-events: none; }
  .song-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  #s-play {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center;
    border: 1px solid var(--rule); border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer;
    transition: color .2s, border-color .2s, transform .3s cubic-bezier(.3,1.5,.5,1);
  }
  #s-play:hover { color: var(--hover); border-color: var(--hover); transform: scale(1.06); }
  #s-play:focus-visible { outline: 2px solid var(--hover); outline-offset: 2px; }
  #s-play[disabled] { opacity: .4; cursor: default; }
  .song-name { font-style: italic; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-name em { font-style: normal; color: var(--muted); }
  @media (max-width: 880px) { #song { margin-top: 64px; } }
  @media (prefers-reduced-motion: reduce) { .vinyl { transition: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="ink">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
  </filter>
</svg>

<div id="tarot" hidden><img id="t-img" alt="Today's tarot card"></div>
<svg id="garden" aria-hidden="true"></svg>
<button id="seed" class="garden-btn" type="button" aria-label="Plant a tomato" title="plant a tomato">
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
    <path class="fruit" d="M12 7.2 C 17.6 6.4, 20.6 10.4, 19.6 14.6 C 18.6 19, 14.6 20.8, 11.4 20.4 C 6.6 20, 3.8 16.4, 4.6 12.2 C 5.3 8.8, 8.4 7.2, 12 7.2 Z"/>
    <path class="shine" d="M7.4 12.4 C 7.6 10.8, 8.6 9.8, 10 9.4"/>
    <path class="calyx" d="M12 7.6 L 12.4 3.4 M12 7.6 L 8.4 6.2 M12 7.6 L 15.8 6 M12 7.6 L 9 9.4 M12 7.6 L 15.2 9.2"/>
  </svg>
</button>
<button id="slurp" class="garden-btn" type="button" aria-label="Slurp the plants back up" title="slurp them back up">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <path class="stem" stroke-width="1.2" d="M12 12.4 C 13.4 12.4, 13.6 10.6, 12.2 10.4 C 10.2 10.2, 9.8 13.2, 11.6 14.2 C 14.2 15.6, 16.8 13, 16 10.2 C 15 6.8, 9.8 6.4, 7.8 9.6 C 5.6 13, 7.6 18.2, 12 18.6 C 16.4 19, 20.2 15.6, 20 11.2"/>
  </svg>
</button>

<main>
  <h1>Jerelevance</h1>

  <!-- Generated automatically from the reports/ folder. Don't edit the list by hand. -->
  <ol id="list">
<!-- LIST -->
  </ol>

  <section id="song" hidden>
    <p class="take">Song of the day &mdash; check back tomorrow!</p>
    <div class="deck">
      <div class="vinyl" id="s-vinyl"><div class="label"><img id="s-art" alt=""></div></div>
      <div class="sleeve"><div id="s-player"></div><img class="cover" id="s-cover" alt=""></div>
    </div>
    <div class="song-row">
      <button id="s-play" type="button" aria-label="Play" title="play" disabled>

<script>
  // Sets the count so numbering runs down to 01 at the bottom
  var l = document.getElementById('list');
  l.style.counterReset = 'item ' + (l.children.length + 1);

  // Sheep tab: on touch screens, first tap opens it, second tap follows the link
  (function () {
    var t = document.getElementById('sub');
    if (!window.matchMedia('(hover: none)').matches) return;
    t.addEventListener('click', function (e) {
      if (!t.classList.contains('open')) { e.preventDefault(); t.classList.add('open'); }
    });
    document.addEventListener('click', function (e) { if (!t.contains(e.target)) t.classList.remove('open'); });
  })();

  // Library of Babel: 22 letters + space, comma, period; 80 characters per line.
  // Each hexagon: 4 walls, 5 shelves per wall, 32 books per shelf, 410 pages, 40 lines per page.
  (function () {
    var SYM = 'abcdefghijlmnopqrstuvx ,.';
    function rnd(n) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    function hexagon() {
      var c = '0123456789abcdefghijklmnopqrstuvwxyz', s = '';
      for (var i = 0; i < 40; i++) s += c[rnd(36)];
      return s;
    }
    var loc = document.getElementById('b-loc'), line = document.getElementById('b-line'),
        btn = document.getElementById('b-shuffle');
    function pull() {
      var hx = hexagon(), t = '';
      for (var i = 0; i < 80; i++) t += SYM[rnd(25)];
      loc.textContent = 'Hexagon ' + hx.slice(0, 6) + '…' + hx.slice(-4) +
        ' · Wall ' + (rnd(4) + 1) + ' · Shelf ' + (rnd(5) + 1) +
        ' · Volume ' + (rnd(32) + 1) + ' · Page ' + (rnd(410) + 1) + ' · Line ' + (rnd(40) + 1);
      loc.title = 'Hexagon ' + hx;
      line.textContent = t;
    }
    pull();
    btn.addEventListener('click', function () {
      btn.classList.toggle('spin');
      line.classList.add('fade');
      setTimeout(function () { pull(); line.classList.remove('fade'); }, 220);
    });
  })();

  // Tomato plants: click the tomato in the left margin; a fuzzy stem grows, wanders,
  // curls, puts out leaves and little yellow flowers (sometimes a side shoot), and
  // ends in a hanging truss of tomatoes. The swirl at the top slurps them all back up.
  (function () {
    var NS = 'http://www.w3.org/2000/svg', STEP = 3, PAD = 36;
    var garden = document.getElementById('garden'), seed = document.getElementById('seed'),
        slurpBtn = document.getElementById('slurp');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var plants = [], last = 0, running = false;
    function R(a, b) { return a + Math.random() * (b - a); }
    function el(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      parent.appendChild(e);
      return e;
    }
    function f(n) { return n.toFixed(1); }
    function turn(want, h) { return Math.atan2(Math.sin(want - h), Math.cos(want - h)); }
    function at(p, deg, sc) {
      return 'translate(' + f(p[0]) + ' ' + f(p[1]) + ') rotate(' + f(deg) + ') scale(' + sc.toFixed(2) + ')';
    }

    // Boxes of the things on the page, so stems lean around them (but can still cross)
    function obstacles() {
      var out = [], M = 4;

    // across it) with chroma held up, so the in-between colours never go grey
    function ramp(p) {
      var lut = new Uint8ClampedArray(256 * 3), stops = [p[0], p[1], p[2], p[3], p[2], p[1], p[0]];
      for (var k = 0; k < 256; k++) {
        var u = k / 256 * 6, i = Math.floor(u), f = u - i, a = stops[i], b = stops[i + 1];
        f = f * f * (3 - 2 * f);
        var dh = ((b.h - a.h + 540) % 360) - 180;
        var c = oklch(a.L + (b.L - a.L) * f, Math.max(.12, a.C + (b.C - a.C) * f), a.h + dh * f);
        lut[k * 3] = c[0]; lut[k * 3 + 1] = c[1]; lut[k * 3 + 2] = c[2];
      }
      return lut;
    }
    // A fluid field: the coordinates are warped twice by moving sine waves, which
    // gives marbled, ink-in-water swirls that never sit still
    var img = cx.createImageData(cv.width, cv.height), box = root.querySelector('.cg-box');
    function fit() {
      var r = box.getBoundingClientRect(), aspect = (r.width || 320) / (r.height || 360);
      var w = Math.round(Math.sqrt(16000 * aspect)), h = Math.round(16000 / w);
      if (w !== cv.width || h !== cv.height) { cv.width = w; cv.height = h; img = cx.createImageData(w, h); }
      // melt: blur in proportion to the box, so fullscreen is as soft as the small box
      cv.style.filter = 'blur(' + Math.round(Math.max(r.width, r.height) / 30) + 'px) saturate(1.15)';
    }
    window.addEventListener('resize', fit);
    function paint(p, time) {
      var lut = ramp(p), w = cv.width, h = cv.height, d = img.data, T = time * .9, u = .9 / Math.min(w, h);
      for (var y = 0; y < h; y++) {
        var ny = 1 + (y - h / 2) * u;
        for (var x = 0; x < w; x++) {
          var nx = .85 + (x - w / 2) * u;
          var qx = nx + .8 * Math.sin(ny * 1.7 + T * 1.1) + .3 * Math.sin(ny * 3.1 - T * .7);
          var qy = ny + .8 * Math.cos(nx * 1.5 - T * .9) + .3 * Math.cos(nx * 2.9 + T * .6);
          var rx = qx + .6 * Math.sin(qy * 2.3 + T * .8);
          var ry = qy + .6 * Math.cos(qx * 2.1 - T * .75);
          var v = .5 + .5 * Math.sin(rx * 1.3 + ry * 1.1 + T * .5);
          v = Math.min(.999, Math.max(0, .5 + (v - .5) * .36 + .06 * Math.sin(rx * .7 - ry * .9 + T * .3) + .32 * Math.sin(T * .23)));
          var k = (v * 255) | 0, o = (y * w + x) * 4;
          d[o] = lut[k * 3]; d[o + 1] = lut[k * 3 + 1]; d[o + 2] = lut[k * 3 + 2]; d[o + 3] = 255;
        }
      }
      cx.putImageData(img, 0, 0);
    }
    var rows = [];
    function buildRows() {
      coords.innerHTML = '';
      rows = [];
      for (var i = 0; i < 4; i++) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'cg-row'; b.title = 'copy';
        b.innerHTML = '<i></i><b></b><span></span>';
        b.addEventListener('click', function (e) {
          var btn = e.currentTarget, v = btn.querySelector('b').textContent;
          try { navigator.clipboard.writeText(v); } catch (err) {}
          btn.classList.add('copied');
          setTimeout(function () { btn.classList.remove('copied'); }, 900);
        });
        coords.appendChild(b); rows.push(b);
      }
    }
    function showValues(p) {
      p.forEach(function (c, i) {
        var r = rows[i];
        r.querySelector('i').style.background = 'rgb(' + c.rgb + ')';
        r.querySelector('b').textContent = hex(c.rgb);
        r.querySelector('span').textContent = 'oklch ' + c.L.toFixed(2) + ' ' + c.C.toFixed(3) + ' ' + Math.round(c.h) + '°';
      });
    }
    var shown = 0;
    function frame(now) {
      var dt = last ? Math.min(100, now - last) : 16; last = now;
      if (!paused) t += dt / 1000 * (reduce ? .2 : .75);
      var p = palette(t);
      paint(p, t);
      // values update while visible: frozen when paused, live when locked and playing
      if ((paused || locked) && now - shown > 90) { showValues(p); shown = now; }
      requestAnimationFrame(frame);
    }
    function setPaused(v) {
      paused = v;
      root.classList.toggle('paused', v);
      play.querySelector('.i-pause').style.display = v ? 'none' : '';
      play.querySelector('.i-play').style.display = v ? '' : 'none';
      play.setAttribute('aria-label', v ? 'Play the gradient' : 'Pause the gradient');
      play.title = v ? 'play' : 'pause';
      if (v) showValues(palette(t));
    }
    play.addEventListener('click', function () { setPaused(!paused); });
    lock.addEventListener('click', function () {
      locked = !locked;
      root.classList.toggle('locked', locked);
      lock.setAttribute('aria-pressed', locked);
      lock.title = locked ? 'unlock: hide the values while it plays' : 'keep the values showing';
    });
    // full screen: the real thing where the browser allows it, a fixed overlay where it
    // doesn't (iPhone Safari only lets videos go full screen)
    var full = document.getElementById('cg-full');
    function isFull() { return document.fullscreenElement === root || document.webkitFullscreenElement === root || root.classList.contains('cg-full'); }
    function syncFull() {
      var on = isFull();
      full.querySelector('.i-open').style.display = on ? 'none' : '';
      full.querySelector('.i-close').style.display = on ? '' : 'none';
      full.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
      full.title = on ? 'exit full screen' : 'full screen';
      requestAnimationFrame(fit);
    }
    full.addEventListener('click', function () {
      if (isFull()) {
        if (root.classList.contains('cg-full')) { root.classList.remove('cg-full'); document.body.style.overflow = ''; }
        else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if (root.requestFullscreen) root.requestFullscreen().catch(function () { root.classList.add('cg-full'); syncFull(); });
      else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
      else { root.classList.add('cg-full'); document.body.style.overflow = 'hidden'; }
      syncFull();
    });
    document.addEventListener('fullscreenchange', syncFull);
    document.addEventListener('webkitfullscreenchange', syncFull);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && root.classList.contains('cg-full')) { root.classList.remove('cg-full'); document.body.style.overflow = ''; syncFull(); } });
    fit();
    buildRows();
    requestAnimationFrame(frame);
  })();

  // Song of the day: one song from the playlist each day, the same for everyone.
  // YouTube's player is the sleeve (it has to stay visible, at least 200 x 200);
  // the record slides out of it and spins while the song plays.
  (function () {
    var sec = document.getElementById('song');
    if (!sec) return;
    var btn = document.getElementById('s-play'), vinyl = document.getElementById('s-vinyl'),
        art = document.getElementById('s-art'), label = vinyl.querySelector('.label'), cover = document.getElementById('s-cover'), name = document.getElementById('s-name');
    var day = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
    var h = 2166136261;
    var key = 'song' + day;
    for (var i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0; h = (h ^ (h >>> 13)) >>> 0;
    var player, playing = false, song, pool, tries = 0;

    // the record's turn: eases up to 33 1/3 rpm and winds down when paused
    var angle = 0, speed = 0, last = 0;
    function turn(t) {
      var dt = last ? Math.min(.05, (t - last) / 1000) : 0; last = t;
      var target = playing ? 200 : 0;
      speed += (target - speed) * Math.min(1, dt * (playing ? 2.2 : 1.1));
      angle = (angle + speed * dt) % 360;
      label.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
      requestAnimationFrame(turn);
    }
    function setPlaying(v) {
      playing = v;
      sec.classList.toggle('playing', v);
      if (v) sec.classList.add('out'); else setTimeout(function () { if (!playing) sec.classList.remove('out'); }, 1400);
      btn.querySelector('.i-play').style.display = v ? 'none' : '';
      btn.querySelector('.i-pause').style.display = v ? '' : 'none';
      btn.setAttribute('aria-label', v ? 'Pause' : 'Play');
      btn.title = v ? 'pause' : 'play';
    }
    function showText(s) {
      name.innerHTML = '';
      name.appendChild(document.createTextNode(s.title + ' '));
      var em = document.createElement('em'); em.textContent = '– ' + s.artist; name.appendChild(em);
      art.src = cover.src = 'https://i.ytimg.com/vi/' + s.id + '/hqdefault.jpg';
    }
    function show(s) {
      song = s; showText(s);
      sec.hidden = false;
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('s-player', {
        width: 200, height: 200, videoId: song.id, host: 'https://www.youtube-nocookie.com',
        playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, iv_load_policy: 3, modestbranding: 1, cc_load_policy: 0 },
        events: {
          onReady: function () { btn.disabled = false; },
          onError: function () {
            // that one won't play here (removed, or no embedding); take the next song instead
            if (!pool || tries++ > 8) { sec.hidden = true; return; }
            h = (h + 1) % pool.length; song = pool[h]; primed = false;
            showText(song); player.cueVideoById(song.id);
            if (playing) setTimeout(function () { player.playVideo(); }, 300);
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING) setPlaying(true);
            if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) setPlaying(false);
          }
        }
      });
    };
    function toggle() {
      if (!player || !player.playVideo) return;
      if (playing) player.pauseVideo(); else { player.playVideo(); setPlaying(true); }
    }
    btn.addEventListener('click', toggle);
    cover.addEventListener('click', toggle);
    fetch('songs.json').then(function (r) { return r.json(); }).then(function (list) {
      if (list.length) { pool = list; h = h % list.length; show(list[h]); }
    }).catch(function () {});
    requestAnimationFrame(turn);
  })();

  // Image of the day: same pick for everyone, changes at midnight Eastern
  (function () {
    var day = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
    var h = 2166136261;
    for (var i = 0; i < day.length; i++) { h ^= day.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    fetch('images.json').then(function (r) { return r.json(); }).then(function (pool) {
      if (!pool.length) return;
      var tries = 0, idx = h % pool.length;
      var img = document.getElementById('d-img');
      function show() {
        var p = pool[idx];
        img.onload = function () { document.getElementById('daily').hidden = false; };
        img.onerror = function () { if (++tries < 5) { idx = (idx + 1) % pool.length; show(); } };
        img.src = p.src;
        document.getElementById('d-link').href = 'https://www.are.na/block/' + p.id;
        var a = document.getElementById('d-src');
        a.href = p.channel;
        a.textContent = p.channel.replace(/^https?:\/\/(www\.)?/, '');
      }
      show();
    }).catch(function () {});

    // Countdown to midnight Eastern, in milliseconds
    var fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hourCycle: 'h23',
      hour: 'numeric', minute: 'numeric', second: 'numeric' });
    var out = document.getElementById('d-ms');
    function tick() {
      var now = new Date(), parts = {};
      fmt.formatToParts(now).forEach(function (x) { parts[x.type] = +x.value; });
      var into = ((parts.hour * 60 + parts.minute) * 60 + parts.second) * 1000 + now.getMilliseconds();
      out.textContent = (86400000 - into).toLocaleString('en-US');
      if (new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(now) !== day) { location.reload(); return; }
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
